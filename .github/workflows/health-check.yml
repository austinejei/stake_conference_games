name: Render Server Health Check

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check /api/health endpoint
        run: |
          echo "Pinging https://play.christiansborg.live/api/health..."
          
          # Fetch the HTTP status code using curl
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://play.christiansborg.live/api/health)
          
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Server is healthy! (HTTP $STATUS)"
          else
            echo "❌ Server health check failed! (HTTP $STATUS)"
            exit 1 # This will cause the GitHub Action to fail and alert you
          fi